document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

     <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noDetail }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-size:12.5px;color:#98A2B3;line-height:1.5;\">Hover a feature on the ring or in the list to inspect it.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1140,&quot;height&quot;:740},&quot;plasmidName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;pNDM-EcHK001&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;plasmidLengthBp&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:54035,&quot;min&quot;:2000,&quot;max&quot;:400000,&quot;tsType&quot;:&quot;number&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Clean&quot;,&quot;Soft&quot;,&quot;Bold&quot;],&quot;default&quot;:&quot;Clean&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showFeatureLabels&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;gcColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#344054&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;skewPositiveColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#16B364&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;skewNegativeColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#7A5AF8&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.C = 400; this.VB = 800; this.N = 420;\n    this.geneOut = 252; this.geneIn = 234;\n    this.gcBase = 200; this.gcAmp = 26;\n    this.skewBase = 140; this.skewAmp = 28;\n    this.scaleR = 92;\n    this.state = {\n      localVariant: (props && props.variant) || 'Clean',\n      show: { genes:true, gc:true, skew:true, scale:true, labels: !(props && props.showFeatureLabels === false) },\n      vbX:0, vbY:0, vbW:800, side:560,\n      hoverGene:null, detailGene:null, tip:null, tipLeft:0, tipTop:0\n    };\n    this._svgRef = (el)=>{ this._svg = el; };\n    this._wrapRef = (el)=>{\n      if(el){\n        this._wrap = el;\n        if(!this._bound){\n          this._bound = true;\n          this._wheelH = (e)=>this.onWheel(e);\n          el.addEventListener('wheel', this._wheelH, {passive:false});\n          this._ro = new ResizeObserver(()=>{\n            const s = Math.floor(Math.min(el.clientWidth, el.clientHeight));\n            if(s>0 && s !== this.state.side) this.setState({side:s});\n          });\n          this._ro.observe(el);\n        }\n      }\n    };\n    this._build();\n  }\n  componentWillUnmount(){ if(this._wrap && this._wheelH) this._wrap.removeEventListener('wheel', this._wheelH); if(this._ro) this._ro.disconnect(); }\n\n  _rng(seed){ let t = seed>>>0; return ()=>{ t += 0x6D2B79F5; let r = Math.imul(t ^ (t>>>15), 1 | t); r ^= r + Math.imul(r ^ (r>>>7), 61 | r); return ((r ^ (r>>>14))>>>0)/4294967296; }; }\n  _smooth(arr, passes){ let a = arr.slice(); const n = a.length; for(let p=0;p<passes;p++){ const b = a.slice(); for(let i=0;i<n;i++){ let s=0,c=0; for(let k=-2;k<=2;k++){ s+=a[(i+k+n)%n]; c++; } b[i]=s/c; } a=b; } return a; }\n\n  _build(){\n    const CATS = {\n      'Plasmid replication':'#EE46BC',\n      'Plasmid stability':'#2E90FA',\n      'MDR region':'#F04438',\n      'Conjugal transfer':'#F79009',\n      'Others':'#98A2B3'\n    };\n    this.CATS = CATS;\n    const layout = [\n      ['Plasmid replication', ['repB','repA'], 0.0, 0.045],\n      ['Plasmid stability', ['parA','stbA','parM'], 0.055, 0.115],\n      ['MDR region', ['ISL3','\\u0394umuD','IS26','blaSHV-12','ygbI','intI1','inSE','groEL','\\u0394groES','cutA1','dsbC','\\u0394trpF','ble','blaNDM-1','ISAba125','IS5','IS3000','Tn3'], 0.125, 0.49],\n      ['Plasmid stability', ['mpr','topB','parB','kikA'], 0.50, 0.61],\n      ['Conjugal transfer', ['taxB','pilX11','pilX10','pilX9','pilX8','pilX6','pilX5','pilX3','pilX2','pilX1','actX','taxA','taxC'], 0.625, 0.95],\n      ['Others', ['dnaJ','orf1','orf2','senB'], 0.955, 0.999]\n    ];\n    const resNames = new Set(['blaNDM-1','blaSHV-12','ble']);\n    const mobNames = new Set(['ISL3','IS26','IS5','IS3000','ISAba125','Tn3','intI1','\\u0394umuD']);\n    const virNames = new Set(['senB']);\n    const rnd = this._rng(7);\n    const genes = [];\n    for(const [cat, names, start, end] of layout){\n      const span = end - start, n = names.length, cell = span/n, gap = cell*0.20;\n      for(let i=0;i<n;i++){\n        const s = start + i*cell + gap/2, e = start + (i+1)*cell - gap/2;\n        const name = names[i];\n        genes.push({ name, category:cat, s, e, mid:(s+e)/2, color:CATS[cat],\n          strand: rnd()>0.5?1:-1,\n          res:resNames.has(name), mob:mobNames.has(name), vir:virNames.has(name) });\n      }\n    }\n    this.genes = genes;\n\n    // GC content + skew windows (fraction-based, length-independent)\n    const N = this.N, rA = this._rng(91), rB = this._rng(53);\n    const noiseG = this._smooth(Array.from({length:N},()=>rA()-0.5), 6);\n    const noiseS = this._smooth(Array.from({length:N},()=>rB()-0.5), 4);\n    const win = [];\n    let sum = 0;\n    for(let i=0;i<N;i++){\n      const f = i/N;\n      let gc = 0.525 + noiseG[i]*1.15;\n      // acquired MDR region reads with distinctly lower GC; two hotspots stand out\n      if(f>0.125 && f<0.49) gc -= 0.055;\n      if(f>0.27 && f<0.31) gc += 0.085;\n      if(f>0.40 && f<0.435) gc -= 0.05;\n      gc = Math.max(0.30, Math.min(0.68, gc));\n      let skew = 0.10*Math.sin(2*Math.PI*f) + 0.05*Math.sin(6*Math.PI*f + 1.1) + noiseS[i]*0.22;\n      if(f>0.27 && f<0.34) skew += 0.06;\n      win.push({ f, gc, skew });\n      sum += gc;\n    }\n    const mean = sum/N;\n    this.win = win; this.gcMean = mean;\n    let mdev=0, mskew=0; for(const w of win){ mdev=Math.max(mdev,Math.abs(w.gc-mean)); mskew=Math.max(mskew,Math.abs(w.skew)); }\n    this.maxDev = mdev || 1; this.maxSkew = mskew || 1;\n\n    // precompute path d-strings (variant-independent geometry)\n    this._gcD = this._area(i=> this.gcBase + Math.max(-1,Math.min(1,(win[i].gc-mean)/this.maxDev))*this.gcAmp, this.gcBase);\n    this._skewPosD = this._area(i=> this.skewBase + Math.max(0,win[i].skew)/this.maxSkew*this.skewAmp, this.skewBase);\n    this._skewNegD = this._area(i=> this.skewBase - Math.max(0,-win[i].skew)/this.maxSkew*this.skewAmp, this.skewBase);\n  }\n\n  P(r, deg){ const a = deg*Math.PI/180; return { x: this.C + r*Math.sin(a), y: this.C - r*Math.cos(a) }; }\n  _area(rOf, base){\n    const n = this.win.length; let d = '';\n    for(let i=0;i<n;i++){ const p = this.P(rOf(i), this.win[i].f*360); d += (i?'L':'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1); }\n    for(let i=n-1;i>=0;i--){ const p = this.P(base, this.win[i].f*360); d += 'L' + p.x.toFixed(1) + ' ' + p.y.toFixed(1); }\n    return d + 'Z';\n  }\n  _geneD(s, e){\n    const a0 = s*360 + 0.4, a1 = e*360 - 0.4, rc = (this.geneIn+this.geneOut)/2;\n    const p0 = this.P(rc, a0), p1 = this.P(rc, a1), large = (a1-a0)>180?1:0;\n    return `M${p0.x.toFixed(1)} ${p0.y.toFixed(1)}A${rc} ${rc} 0 ${large} 1 ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`;\n  }\n  fmt(n){ return Math.round(n).toLocaleString('en-US'); }\n\n  _themes(){\n    const p = this.props || {};\n    const gc = p.gcColor || '#344054', sp = p.skewPositiveColor || '#16B364', sn = p.skewNegativeColor || '#7A5AF8';\n    return {\n      Clean: { bg:'#FFFFFF', grid:'#E4E7EC', dash:'none', gc, gcOp:0.92, sp, sn, sOp:0.92, tick:'#667085', label:'#475467', amr:'#B42318', cap:'butt', center:'#101828', sub:'#98A2B3' },\n      Soft:  { bg:'#FBFAF7', grid:'#EAECF0', dash:'3 4', gc:'#5B6577', gcOp:0.5, sp, sn, sOp:0.6, tick:'#98A2B3', label:'#667085', amr:'#B42318', cap:'round', center:'#344054', sub:'#B0B7C3' },\n      Bold:  { bg:'#0E1726', grid:'rgba(255,255,255,0.09)', dash:'none', gc:'#CDD5E0', gcOp:0.85, sp:'#3CCB7F', sn:'#B692F6', sOp:0.92, tick:'rgba(255,255,255,0.45)', label:'#D6DEEA', amr:'#FDA29B', cap:'round', center:'#F5F7FA', sub:'rgba(255,255,255,0.45)' }\n    };\n  }\n\n  _hitFrom(e){\n    const svg = this._svg; if(!svg) return null;\n    const sr = svg.getBoundingClientRect();\n    const mx = e.clientX - sr.left, my = e.clientY - sr.top;\n    const dataX = this.state.vbX + (mx/sr.width)*this.state.vbW;\n    const dataY = this.state.vbY + (my/sr.height)*this.state.vbW;\n    const dx = dataX - this.C, dy = dataY - this.C, r = Math.hypot(dx, dy);\n    let ang = Math.atan2(dx, -dy)*180/Math.PI; if(ang<0) ang+=360;\n    return { r, deg:ang, frac:ang/360 };\n  }\n\n  onMove(e){\n    const wrap = this._wrap; if(!wrap) return;\n    const wr = wrap.getBoundingClientRect();\n    const tipLeft = e.clientX - wr.left, tipTop = e.clientY - wr.top;\n    if(this._drag){\n      const dx = e.clientX - this._lastX, dy = e.clientY - this._lastY;\n      this._lastX = e.clientX; this._lastY = e.clientY;\n      const k = this.state.vbW / Math.max(1,this.state.side);\n      this.setState(st=>({ vbX: st.vbX - dx*k, vbY: st.vbY - dy*k }));\n      return;\n    }\n    const h = this._hitFrom(e); if(!h){ return; }\n    const length = this.props.plasmidLengthBp || 54035;\n    const st = this.state;\n    // gene band\n    if(h.r >= this.geneIn-3 && h.r <= this.geneOut+3){\n      const g = this.genes.find(g=> h.frac >= g.s && h.frac <= g.e);\n      if(g){\n        const sBp = g.s*length, eBp = g.e*length;\n        const tip = { accent:g.color, title:g.name, italic:true, sub:g.category,\n          rows:[ {l:'position', v:this.fmt(sBp)+'\\u2013'+this.fmt(eBp)+' bp'}, {l:'length', v:this.fmt(eBp-sBp)+' bp'}, {l:'strand', v:g.strand>0?'+ forward':'\\u2212 reverse'}, {l:'class', v: g.res?'AMR gene':g.vir?'Virulence':g.mob?'Mobile element':g.category} ] };\n        if(st.hoverGene!==g.name || st.tip===null || st.detailGene!==g) this.setState({ hoverGene:g.name, detailGene:g, tip, tipLeft, tipTop });\n        else this.setState({ tipLeft, tipTop });\n        return;\n      }\n    }\n    // gc band\n    if(st.show.gc && h.r >= this.gcBase-this.gcAmp-4 && h.r <= this.gcBase+this.gcAmp+4){\n      const i = Math.min(this.N-1, Math.max(0, Math.round(h.frac*this.N)));\n      const w = this.win[i]; const d = (w.gc-this.gcMean)*100;\n      const tip = { accent:(this._themes()[this._vkey()].gc), title:'GC content', sub:this.fmt(h.frac*length)+' bp',\n        rows:[ {l:'GC', v:(w.gc*100).toFixed(1)+'%'}, {l:'vs mean', v:(d>=0?'+':'')+d.toFixed(1)+' pts'} ] };\n      this.setState({ hoverGene:null, tip, tipLeft, tipTop });\n      return;\n    }\n    // skew band\n    if(st.show.skew && h.r >= this.skewBase-this.skewAmp-4 && h.r <= this.skewBase+this.skewAmp+4){\n      const i = Math.min(this.N-1, Math.max(0, Math.round(h.frac*this.N)));\n      const w = this.win[i];\n      const tip = { accent: w.skew>=0 ? (this._themes()[this._vkey()].sp) : (this._themes()[this._vkey()].sn), title:'GC skew', sub:(w.skew>=0?'skew+':'skew\\u2212'),\n        rows:[ {l:'skew', v:w.skew.toFixed(3)}, {l:'position', v:this.fmt(h.frac*length)+' bp'} ] };\n      this.setState({ hoverGene:null, tip, tipLeft, tipTop });\n      return;\n    }\n    if(st.tip || st.hoverGene) this.setState({ tip:null, hoverGene:null });\n  }\n  onDown(e){ if(e.button!==undefined && e.button!==0) return; this._drag=true; this._lastX=e.clientX; this._lastY=e.clientY; try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){} if(this._wrap) this._wrap.style.cursor='grabbing'; this.setState({ tip:null }); }\n  onUp(e){ this._drag=false; if(this._wrap) this._wrap.style.cursor='grab'; }\n  onLeave(){ this._drag=false; if(this._wrap) this._wrap.style.cursor='grab'; this.setState({ tip:null, hoverGene:null }); }\n\n  _zoomTo(nW, mx, my){\n    const st = this.state, side = Math.max(1, this.state.side);\n    nW = Math.min(this.VB
